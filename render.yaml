services:
  - type: web
    name: standalone-ai-ocr
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AIOCR_HOST
        value: 0.0.0.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_IMAGE_DETAIL
        value: high
      - key: AIOCR_USERNAME
        sync: false
      - key: AIOCR_PASSWORD
        sync: false
      - key: AIOCR_FACILITY_ID
        value: demo-facility
      - key: AIOCR_ENCRYPTION_KEY
        generateValue: true
      - key: AIOCR_DATA_DIR
        value: /tmp/standalone-ai-ocr/data
      - key: AIOCR_BACKUP_DIR
        value: /tmp/standalone-ai-ocr/backups
      - key: AIOCR_IMAGE_RETENTION_DAYS
        value: "1"
      - key: DATABASE_URL
        sync: false
